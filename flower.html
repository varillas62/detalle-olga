    <!-- Script para el efecto de Máquina de Escribir -->
    <script>
      // Usamos comillas invertidas (backticks) para permitir los saltos de línea de tu mensaje
      const texto = `Estas flores amarillas son para recordarte lo bonito que es coincidir contigo.
Gracias por llegar y hacer que, de alguna manera, mis días tengan un poquito más de color y alegría. 💛

Con cariño,
Pierre.`;

      const velocidad = 80; // Velocidad de escritura en milisegundos
      let indice = 0;

      function escribirTexto() {
        if (indice < texto.length) {
          document.getElementById("texto-maquina").innerHTML += texto.charAt(indice);
          indice++;
          setTimeout(escribirTexto, velocidad);
        } else {
          // Cuando termina de escribir, muestra la posdata suavemente
          const posdata = document.getElementById("posdata");
          posdata.style.animation = "fadeIn 2s ease-in-out forwards";
        }
      }

      // Iniciar toda la secuencia 2 segundos después de abrir la página
      setTimeout(() => {
        const tarjeta = document.getElementById("tarjeta-lateral");
        tarjeta.style.animation = "fadeIn 2s ease-in-out forwards";
        
        // Empieza a escribir 1.5s después de aparecer la tarjeta negra
        setTimeout(escribirTexto, 1500); 
      }, 2000);
    </script>
