<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css"> 
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Para Olga 🌻</title>
    
    <style>
        /* Estilos principales */
        body {
            margin: 0;
            overflow: hidden; /* Evita barras de desplazamiento */
            background-color: #000;
        }

        /* Canvas para el efecto de programación avanzado (Luciérnagas) */
        #luciernagas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* Se queda en el fondo */
        }

        /* Estilos del texto */
        .contenedor-texto {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 100%;
        }

        .texto-hermosa {
            color: #cccccc;
            font-size: 1.2rem;
            margin-top: -10px;
            margin-bottom: 10px;
            letter-spacing: 2px;
            font-family: sans-serif;
        }

        /* Animación de latido para el botón */
        @keyframes latido {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 235, 59, 0.6); }
            50% { transform: scale(1.1); box-shadow: 0 0 25px rgba(255, 235, 59, 1); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 235, 59, 0.6); }
        }

        .btn-magico {
            background-color: transparent;
            border: 2px solid #ffeb3b;
            padding: 15px 35px;
            border-radius: 30px;
            cursor: pointer;
            animation: latido 1.5s infinite ease-in-out;
            margin-top: 25px;
            transition: background-color 0.3s;
        }

        .btn-magico:hover {
            background-color: rgba(255, 235, 59, 0.2);
        }

        .btn-magico a {
            color: #ffeb3b;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .aviso-audio {
            margin-top: 25px;
            color: #888888;
            font-size: 0.9rem;
            font-style: italic;
            font-family: sans-serif;
        }
    </style>
</head>

<body>

    <!-- Lienzo interactivo (Canvas) -->
    <canvas id="luciernagas"></canvas>

    <div class="contenedor-texto">
        <!-- El efecto original de las letras CSS -->
        <div class="greetings">
            <span>H</span><span>o</span><span>l</span><span>a</span><span>,</span>
        </div>

   
        <div class="greetings">
            <span>O</span><span>L</span><span>G</span><span>A</span>
            <span style="margin-left: 30px;">M</span><span>A</span><span>R</span><span>T</span><span>I</span><span>N</span><span>E</span><span>Z</span>
        </div>
        
        <div class="description" style="margin-top: 15px;">
            <span>ESTE DETALLE ES PARA TI 🌻</span>
        </div>
        
        <!-- Botón con latido -->
        <div class="button">
            <button class="btn-magico">
                <a href="flower.html">DESCÚBRELO AQUÍ</a>
            </button>
        </div>

        <div class="aviso-audio">Sube el volumen 🔊</div>
    </div>

    <!-- SCRIPT DE NIVEL AVANZADO: Sistema de Partículas HTML5 -->
    <script>
        const canvas = document.getElementById('luciernagas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        const numberOfParticles = 80; // Cantidad de luciérnagas

        // Clase Partícula (Programación Orientada a Objetos)
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5; // Tamaño variable
                this.speedX = Math.random() * 1 - 0.5; // Velocidad X
                this.speedY = Math.random() * 1 - 0.5; // Velocidad Y
                this.color = 'rgba(255, 235, 59, 0.8)'; // Color amarillo dorado
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Rebotar en los bordes de la pantalla
                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
                
                // Efecto de brillo (Glow)
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffeb3b';
            }
        }

        // Inicializar el arreglo de partículas
        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        // Bucle de animación
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();

        // Ajustar el canvas si se cambia el tamaño de la ventana o se gira el celular
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });
    </script>
</body>
</html>
